name: Ingest radar sources
on:
  schedule: [{cron: "*/15 * * * *"}]
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: product-jaeger-ingest, cancel-in-progress: false}
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install .
      - run: product-jaeger init-db
        env: {NEON_DATABASE_URL: "${{ secrets.NEON_DATABASE_URL }}"}
      - run: product-jaeger ingest
        env:
          NEON_DATABASE_URL: "${{ secrets.NEON_DATABASE_URL }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
