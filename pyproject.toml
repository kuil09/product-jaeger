[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-jaeger"
version = "0.1.0"
description = "A low-noise early signal radar for products and projects."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = ["httpx>=0.27,<1", "PyYAML>=6,<7", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1", "mypy>=1.13,<2", "types-PyYAML>=6,<7"]

[project.scripts]
product-jaeger = "product_jaeger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
product_jaeger = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP017"]
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["product_jaeger"]
