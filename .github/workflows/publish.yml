name: Publish public archive
on:
  schedule: [{cron: "45 12,22 * * *"}]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install .
      - run: product-jaeger publish --output out/public
        env: {NEON_DATABASE_URL: "${{ secrets.NEON_DATABASE_URL }}"}
      - uses: actions/upload-pages-artifact@v3
        with: {path: out/public}
      - id: deployment
        uses: actions/deploy-pages@v4
